pre-commit:
  jobs:
    - name: test
      glob: "*.{test,spec}.{ts,tsx}"
      run: pnpm vitest run {staged_files}
    - name: lint
      glob: "*.{ts,tsx,astro}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
