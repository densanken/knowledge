name: build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          # contents:read 権限の fine-grained PAT が必要
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up sfw
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # 汚染された package を sfw が検出できるよう pnpm cache は使わない

      - name: Set up Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 汚染された package を sfw が検出できるよう pnpm cache は使わない

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Run build check
        run: pnpm build
        env:
          BETTER_AUTH_URL: "http://localhost:4321"
          BETTER_AUTH_SECRET: "s3qHhi1YX7TUQCGEPWKOVz0kJLzvS3w8puXxctKRJ8M=" # for testing, not a real secret
          DISCORD_CLIENT_ID: "000000000000000000"
          DISCORD_CLIENT_SECRET: "HYP87cR2r12XFnNGfTKkaHzq3OqtnjIf" # for testing, not a real secret
          DISCORD_ALLOWED_GUILD_ID: "000000000000000000"
